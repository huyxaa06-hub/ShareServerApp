name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK manually
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools.zip
        mkdir -p latest
        mv cmdline-tools/* latest/ 2>/dev/null || true
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

    - name: Accept licenses and install components
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Inject Android Plugin and Build
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        
        # Tự động tạo build.gradle ở root nếu chưa có plugin Android
        if ! grep -q "com.android.application" build.gradle 2>/dev/null; then
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
        fi
        
        if ! grep -q "com.android.application" settings.gradle 2>/dev/null; then
          echo "include ':app'" >> settings.gradle
        fi
        
        mkdir -p app/src/main
        if [ ! -f app/build.gradle ]; then
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.shareserver.app'; compileSdk 34; defaultConfig { applicationId 'com.shareserver.app'; minSdk 24; targetSdk 34; versionCd 1; versionName '1.0' } }" >> app/build.gradle
        fi

        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew :app:assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ShareServer-APK
        path: app/build/outputs/apk/debug/app-debug.apk
