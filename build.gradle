buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.shareserver.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.shareserver.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
